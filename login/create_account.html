DESCRIPTION:
Registration. Creates the Auth user and the users/{uid} profile document,
and sends a verification email.
=========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>Create Account</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- Keyboard users land here first and can jump past the navigation. -->
        <a class="skip-link" href="#main">Skip to main content</a>

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <main id="main">
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <div class="form-column">
                        <h1 class="section-title title-main text-center">Create Account</h1>
                        <p class="text-muted-custom text-center lede">
                            Register to start building characters and inventories.
                        </p>

                        <div id="alert-slot" aria-live="polite"></div>

                        <form id="signup-form" novalidate>

                            <div class="field-row">
                                <div class="field">
                                    <label class="form-label text-lg" for="first_name">First name</label>
                                    <input id="first_name" type="text" class="form-control text-lg"
                                           required autocomplete="given-name">
                                </div>
                                <div class="field">
                                    <label class="form-label text-lg" for="last_name">Last name</label>
                                    <input id="last_name" type="text" class="form-control text-lg"
                                           required autocomplete="family-name">
                                </div>
                            </div>

                            <div class="field">
                                <label class="form-label text-lg" for="email">Email</label>
                                <input id="email" type="email" class="form-control text-lg" required
                                       autocomplete="email">
                            </div>

                            <div class="field">
                                <label class="form-label text-lg" for="dob">Date of birth</label>
                                <input id="dob" type="date" class="form-control text-lg">
                            </div>

                            <div class="field">
                                <label class="form-label text-lg" for="password">Password</label>
                                <input id="password" type="password" class="form-control text-lg" required
                                       autocomplete="new-password" aria-describedby="pw-hint">
                                <p class="field-hint" id="pw-hint">At least 8 characters.</p>
                            </div>

                            <div class="field">
                                <label class="form-label text-lg" for="confirm">Confirm password</label>
                                <input id="confirm" type="password" class="form-control text-lg" required
                                       autocomplete="new-password">
                            </div>

                            <div class="form-actions">
                                <button id="submit-btn" type="submit" class="skyrim-btn skyrim-btn-create text-lg">
                                    Create Account
                                </button>
                                <a href="login.html" class="btn-link-quiet">Back to login</a>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>
        </main>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import { renderChrome, signup, url, friendlyError, setAlert } from "../assets/js/app.js";

        const { user } = await renderChrome("signup");
        if (user) window.location.href = url("home.html");

        const form  = document.getElementById("signup-form");
        const btn   = document.getElementById("submit-btn");
        const alert = document.getElementById("alert-slot");

        form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            setAlert(alert, "");

            const password = document.getElementById("password").value;
            const confirm  = document.getElementById("confirm").value;

            if (password !== confirm) {
                setAlert(alert, "The two passwords do not match.");
                document.getElementById("confirm").focus();
                return;
            }
            if (password.length < 8) {
                setAlert(alert, "Password must be at least 8 characters.");
                document.getElementById("password").focus();
                return;
            }

            btn.disabled = true;
            try {
                await signup({
                    firstName: document.getElementById("first_name").value.trim(),
                    lastName:  document.getElementById("last_name").value.trim(),
                    email:     document.getElementById("email").value.trim(),
                    dob:       document.getElementById("dob").value,
                    password
                });
                // A verification email goes out during signup; the account page
                // shows whether it has been confirmed and can send another.
                window.location.href = url("home.html");
            } catch (err) {
                setAlert(alert, friendlyError(err));
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
