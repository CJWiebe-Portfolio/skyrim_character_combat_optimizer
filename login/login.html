=========================================================

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>Login</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <div class="section-title text-left">
                        <h2 class="section-title title-main text-center">Login</h2>

                        <div id="alert-slot"></div>

                        <!-- ===================== LOGIN FORM ===================== -->
                        <form id="login-form" class="text-muted-custom">
                            <label class="form-label text-lg" for="email">Email:</label>
                            <input id="email" type="email" name="email" required class="form-control text-lg"
                                   autocomplete="email"><br>

                            <label class="form-label text-lg" for="password">Password:</label>
                            <input id="password" type="password" name="password" required class="form-control text-lg"
                                   autocomplete="current-password"><br>

                            <button id="submit-btn" type="submit" class="btn btn-primary text-lg">Sign In</button>
                        </form>

                        <p class="text-muted-custom text-lg mt-4">
                            No account yet? <a href="create_account.html">Create one</a>.
                        </p>
                    </div>

                </div>
            </div>
        </div>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import { renderChrome, login, currentUser, url, friendlyError, setAlert } from "../assets/js/app.js";

        const { user } = await renderChrome("login");

        // Already signed in? Go straight to the home page.
        if (user) window.location.href = url("home.html");

        const form  = document.getElementById("login-form");
        const btn   = document.getElementById("submit-btn");
        const alert = document.getElementById("alert-slot");

        form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            setAlert(alert, "");
            btn.disabled = true;

            try {
                await login(
                    document.getElementById("email").value.trim(),
                    document.getElementById("password").value
                );
                window.location.href = url("home.html");
            } catch (err) {
                setAlert(alert, friendlyError(err));
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
