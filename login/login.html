PROJECT: Skyrim Character Combat Optimization System

=========================================================
DESCRIPTION:
Sign-in page, with a password reset request form. Both are handled by
Firebase Auth.
=========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>Login</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- Keyboard users land here first and can jump past the navigation. -->
        <a class="skip-link" href="#main">Skip to main content</a>

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <main id="main">
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <div class="form-column">
                        <h1 class="section-title title-main text-center">Login</h1>

                        <div id="alert-slot" aria-live="polite"></div>

                        <!-- ===================== LOGIN FORM ===================== -->
                        <form id="login-form" novalidate>
                            <div class="field">
                                <label class="form-label text-lg" for="email">Email</label>
                                <input id="email" type="email" name="email" required
                                       class="form-control text-lg" autocomplete="email">
                            </div>

                            <div class="field">
                                <label class="form-label text-lg" for="password">Password</label>
                                <input id="password" type="password" name="password" required
                                       class="form-control text-lg" autocomplete="current-password">
                            </div>

                            <div class="form-actions">
                                <button id="submit-btn" type="submit" class="skyrim-btn skyrim-btn-create text-lg">
                                    Sign In
                                </button>
                                <button id="forgot-toggle" type="button" class="btn-link-quiet">
                                    Forgot your password?
                                </button>
                            </div>
                        </form>

                        <!-- ===================== PASSWORD RESET ===================== -->
                        <form id="reset-form" class="inset-panel" hidden novalidate>
                            <h2 class="panel-title">Reset your password</h2>
                            <p class="text-muted-custom text-m">
                                We'll email you a link to set a new one.
                            </p>

                            <div class="field">
                                <label class="form-label" for="reset-email">Email</label>
                                <input id="reset-email" type="email" class="form-control" required
                                       autocomplete="email">
                            </div>

                            <div class="form-actions">
                                <button id="reset-btn" type="submit" class="skyrim-btn skyrim-btn-update">
                                    Send reset link
                                </button>
                                <button id="reset-cancel" type="button" class="btn-link-quiet">Cancel</button>
                            </div>
                        </form>

                        <p class="text-muted-custom text-lg form-footnote">
                            No account yet? <a href="create_account.html">Create one</a>.
                        </p>
                    </div>

                </div>
            </div>
        </div>
        </main>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import { renderChrome, login, resetPassword, url, friendlyError, setAlert, toast }
            from "../assets/js/app.js";

        const { user } = await renderChrome("login");

        // Already signed in? Go straight to the home page.
        if (user) window.location.href = url("home.html");

        const alert      = document.getElementById("alert-slot");
        const loginForm  = document.getElementById("login-form");
        const resetForm  = document.getElementById("reset-form");
        const submitBtn  = document.getElementById("submit-btn");
        const resetBtn   = document.getElementById("reset-btn");
        const emailInput = document.getElementById("email");

        /* ---------- sign in ---------- */
        loginForm.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            setAlert(alert, "");
            submitBtn.disabled = true;

            try {
                await login(emailInput.value.trim(), document.getElementById("password").value);
                window.location.href = url("home.html");
            } catch (err) {
                setAlert(alert, friendlyError(err));
                submitBtn.disabled = false;
            }
        });

        /* ---------- forgot password ---------- */
        document.getElementById("forgot-toggle").addEventListener("click", () => {
            resetForm.hidden = false;
            // Carry across whatever they already typed, so they don't retype it.
            const reset = document.getElementById("reset-email");
            if (!reset.value) reset.value = emailInput.value.trim();
            reset.focus();
        });

        document.getElementById("reset-cancel").addEventListener("click", () => {
            resetForm.hidden = true;
            emailInput.focus();
        });

        resetForm.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            setAlert(alert, "");

            const address = document.getElementById("reset-email").value.trim();
            if (!address) {
                setAlert(alert, "Enter your email address first.");
                return;
            }

            resetBtn.disabled = true;
            try {
                await resetPassword(address);
                resetForm.hidden = true;
                // Deliberately not confirming whether the address exists — Firebase
                // doesn't either, and saying so would leak who has an account.
                setAlert(
                    alert,
                    "If an account exists for " + address + ", a reset link is on its way. " +
                    "Check your spam folder too.",
                    "success"
                );
            } catch (err) {
                setAlert(alert, friendlyError(err));
            } finally {
                resetBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
