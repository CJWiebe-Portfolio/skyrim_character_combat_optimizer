FILE: inventory.html
PROJECT: Skyrim Character Combat Optimization System
AUTHOR: C.J. Wiebe
=========================================================
DESCRIPTION:
Inventory management now lives on the character sheet, so this page only
forwards old links and bookmarks to the sheet's Inventory section.
=========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory moved</title>
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="container py-5">
        <div class="main-container p-5">
            <h1 class="title-main">Inventory has moved</h1>
            <p class="text-muted-custom">
                Inventories are now managed on the character sheet.
                <a id="go" href="characters.html">Take me there</a>.
            </p>
        </div>
    </div>

    <script>
        const cid = new URLSearchParams(location.search).get("character_id");
        const target = cid
            ? "read_character.html?id=" + encodeURIComponent(cid) + "#inventory"
            : "characters.html";
        document.getElementById("go").href = target;
        location.replace(target);
    </script>
</body>

</html>
