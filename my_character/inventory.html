=========================================================
FILE: inventory.html
PROJECT: Skyrim Character Combat Optimization System
AUTHOR: C.J. Wiebe
=========================================================
DESCRIPTION:
Create, read, update and delete the items in one character's inventory, stored at
users/{uid}/characters/{characterId}/inventory/{itemId}.
=========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>Inventory Management</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <div class="section-title">
                        <h1 class="section-title title-main text-center">
                            &#127890; <span id="char-name"></span>'s Inventory &#127890;
                        </h1>
                        <h5 class="text-muted-custom text-center">
                            You can manage your character's inventory from here by adding items or managing the
                            quantity of existing ones, and deleting items as needed.
                        </h5>
                        <br>
                        <a href="characters.html" class="btn btn-primary text-lg">Back to My Characters</a>
                    </div>
                    <br>

                    <div id="alert-slot"></div>

                    <!-- ADD ITEM FORM -->
                    <div class="card-body">
                        <form id="add-form" class="row mb-4 align-items-end skyrim-filter col-md-8">
                            <div class="col-md-5">
                                <label class="form-label" for="add-item">Item</label>
                                <select id="add-item" class="form-select"></select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label" for="add-qty">Qty</label>
                                <input id="add-qty" type="number" value="1" min="1" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <button type="submit" class="btn btn-success w-100">Add Item</button>
                            </div>
                        </form>
                    </div>

                    <!-- INVENTORY TOTALS -->
                    <p id="inv-summary" class="text-muted-custom text-lg"></p>

                    <!-- INVENTORY TABLE -->
                    <div class="table-responsive">
                        <table class="table-skyrim">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Damage</th>
                                    <th>Speed</th>
                                    <th>Defence</th>
                                    <th>Weight</th>
                                    <th>Gold</th>
                                    <th>Category</th>
                                    <th>Class</th>
                                    <th>Perk</th>
                                    <th>Upgrade</th>
                                    <th>Qty</th>
                                </tr>
                            </thead>
                            <tbody id="inv-rows">
                                <tr><td colspan="11">Loading&hellip;</td></tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import {
            renderChrome, requireAuth, refData, effectiveSpeed, fmtWeight, fmtSpeed, getCharacter,
            listInventory, addInventoryItem, increaseInventoryItem,
            decreaseInventoryItem, deleteInventoryItem,
            halt, esc, friendlyError, setAlert
        } from "../assets/js/app.js";

        renderChrome("characters");
        const user = await requireAuth();

        const alert = document.getElementById("alert-slot");
        const cid = new URLSearchParams(location.search).get("character_id");

        if (!cid) {
            setAlert(alert, "No character selected.");
            await halt();
        }

        const data = await refData();
        const character = await getCharacter(user.uid, cid);

        if (!character) {
            setAlert(alert, "Character not found or access denied.");
            await halt();
        }

        document.getElementById("char-name").textContent = character.name;
        document.title = character.name + "'s Inventory";

        // ---------- Item picker, sorted by name like the PHP query ----------
        const itemsById = new Map(data.items.map((i) => [i.item_id, i]));
        const picker = document.getElementById("add-item");
        [...data.items]
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach((i) => {
                const opt = document.createElement("option");
                opt.value = i.item_id;
                opt.textContent = i.name;
                picker.appendChild(opt);
            });

        const tbody   = document.getElementById("inv-rows");
        const summary = document.getElementById("inv-summary");
        const dash    = (v) => (v === null || v === undefined ? "\u2014" : v);

        let inventory = [];

        function render() {
            if (!inventory.length) {
                tbody.innerHTML = `<tr><td colspan="11">No items in inventory.</td></tr>`;
                summary.textContent = "";
                return;
            }

            const rows = inventory
                .map((row) => {
                    const item = itemsById.get(row.itemId);
                    if (!item) return null;
                    return { ...item, speed: effectiveSpeed(item, data), quantity: row.quantity };
                })
                .filter(Boolean)
                .sort((a, b) => a.name.localeCompare(b.name));

            const totalWeight = rows.reduce((s, r) => s + (r.weight || 0) * r.quantity, 0);
            const totalGold   = rows.reduce((s, r) => s + (r.gold_value || 0) * r.quantity, 0);
            const totalItems  = rows.reduce((s, r) => s + r.quantity, 0);
            summary.textContent =
                `${totalItems} item${totalItems === 1 ? "" : "s"} \u00b7 ` +
                `${totalWeight.toFixed(2)} weight \u00b7 ${totalGold} gold`;

            tbody.innerHTML = rows.map((it) => `
                <tr>
                    <td>${esc(it.name)}</td>
                    <td>${dash(it.damage)}</td>
                    <td>${dash(fmtSpeed(it.speed))}</td>
                    <td>${dash(it.defence)}</td>
                    <td>${dash(fmtWeight(it.weight))}</td>
                    <td>${dash(it.gold_value)}</td>
                    <td>${data.categories[it.category_id] ?? "Unknown"}</td>
                    <td>${data.classifications[it.classification_id] ?? "Unknown"}</td>
                    <td>${data.perks[it.perk_id] ?? "\u2014"}</td>
                    <td>${data.upgrades[it.item_upgrade] ?? "\u2014"}</td>
                    <td>
                        <div class="d-flex justify-content-center align-items-center gap-2">
                            <span class="form-label text-lg">${it.quantity}</span>
                            <button class="btn btn-sm btn-outline-warning text-m"
                                    data-act="decrease" data-id="${it.item_id}">&#10134;</button>
                            <button class="btn btn-sm btn-outline-success text-m"
                                    data-act="increase" data-id="${it.item_id}">&#10133;</button>
                            <button class="btn btn-sm btn-outline-danger text-m"
                                    data-act="delete" data-id="${it.item_id}">&#128465;</button>
                        </div>
                    </td>
                </tr>`).join("");

            tbody.querySelectorAll("[data-act]").forEach((btn) => {
                btn.addEventListener("click", () => act(btn));
            });
        }

        async function act(btn) {
            const { act: action, id } = btn.dataset;
            const itemId = Number(id);

            if (action === "delete" && !confirm("Delete item?")) return;

            setAlert(alert, "");
            btn.disabled = true;
            try {
                if (action === "increase") {
                    await increaseInventoryItem(user.uid, cid, itemId);
                } else if (action === "decrease") {
                    await decreaseInventoryItem(user.uid, cid, itemId);
                } else if (action === "delete") {
                    await deleteInventoryItem(user.uid, cid, itemId);
                }
                await reload();
            } catch (err) {
                setAlert(alert, friendlyError(err));
                btn.disabled = false;
            }
        }

        async function reload() {
            inventory = await listInventory(user.uid, cid);
            render();
        }

        document.getElementById("add-form").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            setAlert(alert, "");

            const itemId = Number(picker.value);
            const qty = Math.max(1, Number(document.getElementById("add-qty").value) || 1);

            try {
                await addInventoryItem(user.uid, cid, itemId, qty);
                await reload();
            } catch (err) {
                setAlert(alert, friendlyError(err));
            }
        });

        try {
            await reload();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="11">\u2014</td></tr>`;
            setAlert(alert, friendlyError(err));
        }
    </script>
</body>

</html>
