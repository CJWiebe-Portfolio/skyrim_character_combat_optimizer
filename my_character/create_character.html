PROJECT: Skyrim Character Combat Optimization System
AUTHOR: C.J. Wiebe
=========================================================
DESCRIPTION:
Creates a character under users/{uid}/characters. The character number is the
highest existing number for this account plus one, as the PHP version did.
=========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>Create Character</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <div class="section-title mb-4">
                        <h1 class="section-title title-main text-center">&#10133; Create New Character and Inventory</h1>
                        <h5 class="text-muted-custom text-center">
                            This will create a new character and their initial inventory.
                        </h5>
                    </div>

                    <div id="alert-slot"></div>

                    <!-- ========================= CREATE FORM ========================= -->
                    <form id="create-form">

                        <div class="mb-3">
                            <label class="form-label text-lg" for="name">Character Name</label>
                            <input id="name" type="text" class="form-control text-lg" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-lg" for="race_id">Race</label>

                                <select id="race_id" class="form-select text-lg" required>
                                    <option value="">Select a race</option>
                                </select>

                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button id="submit-btn" type="submit" class="btn skyrim-btn-create text-lg">
                                &#128190; Create Character
                            </button>
                            <a href="characters.html" class="btn btn-primary text-lg">Back to My Characters</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import {
            renderChrome, requireAuth, refData, createCharacter, friendlyError, setAlert
        } from "../assets/js/app.js";

        renderChrome("characters");
        const user = await requireAuth();

        const data   = await refData();
        const select = document.getElementById("race_id");
        const btn    = document.getElementById("submit-btn");
        const alert  = document.getElementById("alert-slot");

        for (const [id, name] of Object.entries(data.races)) {
            const opt = document.createElement("option");
            opt.value = id;
            opt.textContent = name;
            select.appendChild(opt);
        }

        document.getElementById("create-form").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            setAlert(alert, "");

            const name   = document.getElementById("name").value.trim();
            const raceId = select.value;

            if (!name || !raceId) {
                setAlert(alert, "All fields are required.");
                return;
            }

            btn.disabled = true;
            try {
                await createCharacter(user.uid, { name, raceId });
                window.location.href = "characters.html?created=1";
            } catch (err) {
                setAlert(alert, "Creation failed: " + friendlyError(err));
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
