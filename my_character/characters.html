PROJECT: Skyrim Character Combat Optimization System

DESCRIPTION:
Lists every character under users/{uid}/characters, with sorting and links into
each character's inventory.
=========================================================

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>My Characters</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <div class="section-title">
                        <h1 class="section-title title-main text-center">
                            &#128101; Viewing Characters of <span id="owner-name"></span> &#128101;
                        </h1>
                        <h5 class="text-muted-custom text-center">This is all the characters you have created</h5>
                    </div>
                    <br>

                    <!-- ========================= CREATE CHARACTER BUTTON ========================= -->
                    <div class="col-md-5">
                        <div class="p-3 text-center">
                            <a href="create_character.html" class="skyrim-btn skyrim-btn-create text-lg">
                                &#10133; Create New Character with a Inventory
                            </a>
                        </div>
                    </div>
                    <br>

                    <!-- ========================= FILTER + SORT FORM ========================= -->
                    <form id="filter-form" class="row mb-4 align-items-end skyrim-filter col-md-8">
                        <div class="col-md-5">
                            <label class="form-label" for="f-sort">Sort By</label>
                            <select id="f-sort" class="form-select">
                                <option value="">None</option>
                                <option value="characterNumber">Character Number</option>
                                <option value="raceId">Race</option>
                                <option value="name">Name</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label" for="f-order">Order</label>
                            <select id="f-order" class="form-select">
                                <option value="ASC">Ascending</option>
                                <option value="DESC">Descending</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-warning w-100">Apply</button>
                        </div>
                    </form>

                    <div id="alert-slot"></div>

                    <!-- ========================= DATA TABLE ========================= -->
                    <div class="table-responsive">
                        <table class="table-skyrim text-lg">
                            <thead>
                                <tr>
                                    <th>Character Number</th>
                                    <th>Race</th>
                                    <th>Name</th>
                                    <th>Inventory</th>
                                    <th>Modify</th>
                                </tr>
                            </thead>
                            <tbody id="char-rows" class="text-center">
                                <tr><td colspan="5">Loading&hellip;</td></tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import {
            renderChrome, requireAuth, refData, listCharacters, deleteCharacter,
            esc, friendlyError, setAlert
        } from "../assets/js/app.js";

        const { profile } = await renderChrome("characters");
        const user = await requireAuth();

        document.getElementById("owner-name").textContent = profile?.firstName || user.email;

        const data   = await refData();
        const tbody  = document.getElementById("char-rows");
        const fSort  = document.getElementById("f-sort");
        const fOrder = document.getElementById("f-order");
        const alert  = document.getElementById("alert-slot");

        let characters = [];

        function render() {
            const sort = fSort.value;
            const desc = fOrder.value === "DESC";

            let rows = [...characters];
            if (sort) {
                rows.sort((a, b) => {
                    const x = a[sort], y = b[sort];
                    const cmp = typeof x === "string" ? x.localeCompare(y) : (x || 0) - (y || 0);
                    return desc ? -cmp : cmp;
                });
            }

            if (!rows.length) {
                tbody.innerHTML =
                    `<tr><td colspan="5">No characters yet. Create one to get started.</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.map((c) => `
                <tr>
                    <td>${c.characterNumber ?? "\u2014"}</td>
                    <td>${data.races[c.raceId] ?? "Unknown"}</td>
                    <td>${esc(c.name)}</td>
                    <td>
                        <a href="inventory.html?character_id=${encodeURIComponent(c.id)}"
                           class="btn btn-primary text-lg">&#127890; ${esc(c.name)}'s Inventory &#127890;</a>
                    </td>
                    <td>
                        <a href="read_character.html?id=${encodeURIComponent(c.id)}"
                           class="btn btn-info btn-sm text-lg">&#128065;&#65039;</a>
                        <a href="update_character.html?id=${encodeURIComponent(c.id)}"
                           class="btn btn-warning btn-sm text-lg">&#9999;&#65039;</a>
                        <button class="btn btn-danger btn-sm text-lg"
                                data-delete="${esc(c.id)}" data-name="${esc(c.name)}">&#10006;&#65039;</button>
                    </td>
                </tr>`).join("");

            tbody.querySelectorAll("[data-delete]").forEach((btn) => {
                btn.addEventListener("click", async () => {
                    if (!confirm("Are you sure you want to delete this character?")) return;
                    btn.disabled = true;
                    try {
                        await deleteCharacter(user.uid, btn.dataset.delete);
                        characters = characters.filter((c) => c.id !== btn.dataset.delete);
                        render();
                    } catch (err) {
                        setAlert(alert, friendlyError(err));
                        btn.disabled = false;
                    }
                });
            });
        }

        document.getElementById("filter-form").addEventListener("submit", (ev) => {
            ev.preventDefault();
            render();
        });

        try {
            characters = await listCharacters(user.uid);
            render();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="5">\u2014</td></tr>`;
            setAlert(alert, friendlyError(err));
        }
    </script>
</body>

</html>
