<!--
=========================================================
FILE: characters.html
PROJECT: Skyrim Character Combat Optimization System
AUTHOR: C.J. Wiebe
=========================================================
DESCRIPTION:
The roster. Every character under users/{uid}/characters shown as a card with
its race, name, level and vitals, sortable, with one way in: the character
sheet. Inventory and deletion both live on the sheet itself.
=========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>My Characters</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- Keyboard users land here first and can jump past the navigation. -->
        <a class="skip-link" href="#main">Skip to main content</a>

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <main id="main">
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <!-- ========================= PAGE HEAD ========================= -->
                    <div class="roster-head">
                        <div>
                            <h1 class="title-main">My Characters</h1>
                            <p class="text-muted-custom" id="roster-sub">&nbsp;</p>
                        </div>
                        <a href="create_character.html" class="skyrim-btn skyrim-btn-create btn-compact">
                            &#10133; New character
                        </a>
                    </div>

                    <!-- ========================= SORT BAR ========================= -->
                    <form id="filter-form" class="roster-tools">
                        <div class="roster-tool">
                            <label class="form-label" for="f-sort">Sort by</label>
                            <select id="f-sort" class="form-select">
                                <option value="characterNumber">Character number</option>
                                <option value="name">Name</option>
                                <option value="race">Race</option>
                                <option value="level">Level</option>
                            </select>
                        </div>
                        <div class="roster-tool">
                            <label class="form-label" for="f-order">Order</label>
                            <select id="f-order" class="form-select">
                                <option value="ASC">Ascending</option>
                                <option value="DESC">Descending</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-row">Apply</button>
                    </form>

                    <div id="alert-slot" aria-live="polite"></div>

                    <!-- ========================= CHARACTER CARDS ========================= -->
                    <div id="char-grid" class="char-grid">
                        <p class="text-muted-custom">Loading&hellip;</p>
                    </div>

                </div>
            </div>
        </div>
        </main>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import {
            renderChrome, requireAuth, refData, buildData, listCharacters, withDefaultBuild,
            derivedLevel, attributes, esc, friendlyError, setAlert, toast
        } from "../assets/js/app.js";

        const { profile } = await renderChrome("characters");
        const user = await requireAuth();

        const [data, bd] = await Promise.all([refData(), buildData()]);

        const grid   = document.getElementById("char-grid");
        const sub    = document.getElementById("roster-sub");
        const fSort  = document.getElementById("f-sort");
        const fOrder = document.getElementById("f-order");
        const alert  = document.getElementById("alert-slot");

        const owner = profile?.firstName || user.email;

        /** Level and vitals come straight from the saved build — no extra reads. */
        function summarise(raw) {
            const c = withDefaultBuild(raw, bd);
            const attrs = attributes(c.attributePicks, bd);
            return {
                id: c.id,
                characterNumber: c.characterNumber ?? null,
                name: c.name ?? "Unnamed",
                race: data.races[c.raceId] ?? "Unknown",
                level: derivedLevel(c.skills, c.raceId, bd).level,
                health: attrs.health,
                magicka: attrs.magicka,
                stamina: attrs.stamina
            };
        }

        let characters = [];

        function render() {
            const sort = fSort.value || "characterNumber";
            const desc = fOrder.value === "DESC";

            const rows = [...characters].sort((a, b) => {
                const x = a[sort], y = b[sort];
                const cmp = typeof x === "string"
                    ? x.localeCompare(y)
                    : (x ?? 0) - (y ?? 0);
                return desc ? -cmp : cmp;
            });

            sub.textContent = rows.length
                ? `${owner} · ${rows.length} character${rows.length === 1 ? "" : "s"}`
                : owner;

            if (!rows.length) {
                grid.innerHTML = `
                    <div class="char-empty">
                        <p class="text-muted-custom">No characters yet.</p>
                        <a href="create_character.html" class="skyrim-btn skyrim-btn-create btn-compact">
                            Create your first character
                        </a>
                    </div>`;
                return;
            }

            grid.innerHTML = rows.map((c) => `
                <article class="char-card">
                    <div class="char-card-head">
                        <div class="char-card-id">
                            <span class="char-number">${c.characterNumber == null
                                ? "—" : "#" + c.characterNumber}</span>
                            <span class="char-race">${esc(c.race)}</span>
                        </div>
                        <h2 class="char-name">${esc(c.name)}</h2>
                    </div>

                    <dl class="char-vitals">
                        <div class="vital vital-level">
                            <dt>Level</dt><dd>${c.level}</dd>
                        </div>
                        <div class="vital vital-health">
                            <dt>Health</dt><dd>${c.health}</dd>
                        </div>
                        <div class="vital vital-magicka">
                            <dt>Magicka</dt><dd>${c.magicka}</dd>
                        </div>
                        <div class="vital vital-stamina">
                            <dt>Stamina</dt><dd>${c.stamina}</dd>
                        </div>
                    </dl>

                    <a class="char-open" href="read_character.html?id=${encodeURIComponent(c.id)}">
                        Open character sheet
                    </a>
                </article>`).join("");
        }

        document.getElementById("filter-form").addEventListener("submit", (ev) => {
            ev.preventDefault();
            render();
        });
        fSort.addEventListener("change", render);
        fOrder.addEventListener("change", render);

        try {
            characters = (await listCharacters(user.uid)).map(summarise);
            render();
            if (new URLSearchParams(location.search).get("created")) toast("Character created");
        } catch (err) {
            grid.innerHTML = "";
            sub.textContent = owner;
            setAlert(alert, friendlyError(err));
        }
    </script>
</body>

</html>
