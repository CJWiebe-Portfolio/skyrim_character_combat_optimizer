<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>Title - Skyrim Optimizer</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="./assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="./assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="./assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- Keyboard users land here first and can jump past the navigation. -->
        <a class="skip-link" href="#main">Skip to main content</a>

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <main id="main">
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5 mx-auto text-center">

                    <img src="assets/images/skyrim_icon.png"
                         class="skyrim-title-logo text-center"
                         alt="Skyrim Logo">

                    <h1 class="skyrim-title-main">Skyrim Optimizer</h1>

                    <div class="skyrim-title-sub">Preparing your adventure...</div>

                    <a href="home.html" class="btn-skyrim-sm primary mt-3">Skip &rarr;</a>

                </div>
            </div>
        </div>
        </main>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "./";</script>
    <script type="module">
        // Smooth redirect to the home page, exactly as the PHP landing page did.
        setTimeout(() => {
            document.body.style.transition = "opacity 0.5s ease";
            document.body.style.opacity = 0;
        }, 2500);
        setTimeout(() => {
            window.location.href = "home.html";
        }, 3000);
    </script>
</body>

</html>
