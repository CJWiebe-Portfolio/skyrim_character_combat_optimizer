<!--
=========================================================
FILE: delete_account.html
PROJECT: Skyrim Character Combat Optimization System
AUTHOR: C.J. Wiebe
=========================================================
DESCRIPTION:
Deletes the user's characters, inventories, profile document and Auth user,
in that order, after re-authenticating.
=========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>Delete Account</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- Keyboard users land here first and can jump past the navigation. -->
        <a class="skip-link" href="#main">Skip to main content</a>

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <main id="main">
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <div class="form-column">
                        <h1 class="section-title title-main text-center">Delete your account</h1>
                        <p class="text-muted-custom text-center lede">
                            This cannot be undone.
                        </p>

                        <div class="inset-panel inset-danger">
                            <h2 class="panel-title">What gets deleted</h2>
                            <ul class="plain-list text-muted-custom text-m">
                                <li id="del-chars">Your characters and their inventories</li>
                                <li>Your profile details</li>
                                <li>Your sign-in, so this email can register again from scratch</li>
                            </ul>
                        </div>

                        <div id="alert-slot" aria-live="polite"></div>

                        <form id="delete-form" novalidate>
                            <div class="field">
                                <label class="form-label" for="password">
                                    Type your password to confirm
                                </label>
                                <input id="password" type="password" class="form-control" required
                                       autocomplete="current-password">
                            </div>

                            <div class="form-actions">
                                <button id="submit-btn" type="submit" class="skyrim-btn skyrim-btn-delete">
                                    Permanently delete my account
                                </button>
                                <a href="read_account.html" class="btn-link-quiet">Cancel</a>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
        </main>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import {
            renderChrome, requireAuth, reauth, deleteUser,
            listCharacters, deleteCharacter, deleteProfileDoc,
            url, friendlyError, setAlert
        } from "../assets/js/app.js";

        renderChrome("account");
        const user = await requireAuth();

        const alert = document.getElementById("alert-slot");
        const btn   = document.getElementById("submit-btn");

        // Say how much is actually at stake, rather than a generic warning.
        let characters = [];
        try {
            characters = await listCharacters(user.uid);
            document.getElementById("del-chars").textContent =
                characters.length
                    ? characters.length + " character" + (characters.length === 1 ? "" : "s") +
                      " and their inventories: " + characters.map((c) => c.name).join(", ")
                    : "You have no characters saved";
        } catch {
            // Non-fatal: the generic wording already in the page stands.
        }

        document.getElementById("delete-form").addEventListener("submit", async (ev) => {
            ev.preventDefault();
            setAlert(alert, "");

            if (!confirm("Delete your account and all of its data? This cannot be undone.")) return;

            btn.disabled = true;
            try {
                // Firebase needs a recent sign-in before it will delete the user.
                await reauth(user, document.getElementById("password").value);

                // Clear the user's own data first: once the Auth user is gone, the
                // security rules no longer let anyone touch these documents.
                for (const c of characters) {
                    await deleteCharacter(user.uid, c.id);
                }
                await deleteProfileDoc(user.uid);

                await deleteUser(user);
                window.location.href = url("home.html");
            } catch (err) {
                setAlert(alert, friendlyError(err));
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
