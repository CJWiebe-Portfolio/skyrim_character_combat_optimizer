PROJECT: Skyrim Character Combat Optimization System
AUTHOR: C.J. Wiebe
=========================================================
DESCRIPTION:
Edits the profile in users/{uid} and, where asked, the Firebase Auth email
and password. Email and password changes are re-authenticated first.
=========================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===================== PAGE TITLE ===================== -->
    <title>Update Account</title>

    <!-- ===================== FAVICON ===================== -->
    <link rel="icon" type="image/png" href="../assets/images/skyrim_icon.png">

    <!-- ===================== CSS ===================== -->
    <!-- =========== BOOTSTRAP =========== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- =========== GENERAL STYLES =========== -->
    <link rel="stylesheet" href="../assets/css/general_style.css">
    <!-- =========== BACKGROUND =========== -->
    <link rel="stylesheet" href="../assets/css/background_picture.css">
</head>

<body>
    <div class="d-flex flex-column min-vh-100">

        <!-- ===================== NAVBAR (rendered by app.js) ===================== -->
        <div id="navbar-slot"></div>

        <!-- ===================== MAIN CONTENT ===================== -->
        <div class="container py-5 mt-1 flex-grow-1">
            <div class="main-container p-4">
                <div class="main-container p-5">

                    <h1 class="section-title title-main text-center">
                        &#9999;&#65039; Update <span id="acct-name"></span> Account &#9999;&#65039;
                    </h1>
                    <h5 class="text-muted-custom text-center">
                        This is all the information you can update for your account
                    </h5>
                    <br>

                    <div id="alert-slot"></div>

                    <form id="update-form">

                        <div class="mb-3">
                            <label class="form-label text-lg" for="first_name">First Name</label>
                            <input id="first_name" type="text" class="form-control text-lg" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-lg" for="last_name">Last Name</label>
                            <input id="last_name" type="text" class="form-control text-lg" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-lg" for="email">Email [e.g. email@email.email]</label>
                            <input id="email" type="email" class="form-control text-lg" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-lg" for="dob">Date of Birth</label>
                            <input id="dob" type="date" class="form-control text-lg">
                        </div>

                        <p class="text-muted-custom text-m">
                            Changing your email address or password requires your current password.
                        </p>

                        <div class="mb-3">
                            <label class="form-label text-lg" for="current_password">Current Password</label>
                            <input id="current_password" type="password" class="form-control text-lg"
                                   autocomplete="current-password">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-lg" for="new_password">New Password</label>
                            <input id="new_password" type="password" class="form-control text-lg"
                                   autocomplete="new-password">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-lg" for="confirm_password">Confirm New Password</label>
                            <input id="confirm_password" type="password" class="form-control text-lg"
                                   autocomplete="new-password">
                        </div>

                        <br>
                        <div class="d-flex gap-2">
                            <button id="submit-btn" type="submit" class="skyrim-btn skyrim-btn-update text-center text-lg">
                                &#9999;&#65039; Update Account Information
                            </button>
                            <a href="read_account.html" class="btn btn-primary text-lg">Back to My Account</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>

        <!-- ===================== FOOTER (rendered by app.js) ===================== -->
        <div id="footer-slot"></div>

    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.SITE_ROOT = "../";</script>
    <script type="module">
        import {
            renderChrome, requireAuth, ensureProfile, saveProfile,
            reauth, updatePassword, updateEmail, friendlyError, setAlert
        } from "../assets/js/app.js";

        renderChrome("account");
        const user = await requireAuth();

        const form  = document.getElementById("update-form");
        const btn   = document.getElementById("submit-btn");
        const alert = document.getElementById("alert-slot");

        const $ = (id) => document.getElementById(id);

        // Pre-fill the form from the stored profile.
        const profile = (await ensureProfile(user)) || {};
        $("first_name").value = profile.firstName || "";
        $("last_name").value  = profile.lastName || "";
        $("email").value      = profile.email || user.email || "";
        $("dob").value        = profile.dob || "";
        $("acct-name").textContent = profile.firstName || "your";

        form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            setAlert(alert, "");

            const firstName = $("first_name").value.trim();
            const lastName  = $("last_name").value.trim();
            const email     = $("email").value.trim();
            const dob       = $("dob").value;

            const currentPassword = $("current_password").value;
            const newPassword     = $("new_password").value;
            const confirmPassword = $("confirm_password").value;

            if (!firstName || !lastName || !email) {
                setAlert(alert, "Please fill in all required fields.");
                return;
            }

            const wantsPasswordChange = !!(newPassword || confirmPassword);
            const emailChanged = email !== (user.email || "");

            // Same password rules as the PHP page.
            if (wantsPasswordChange) {
                if (!currentPassword || !newPassword || !confirmPassword) {
                    setAlert(alert, "Please fill in all password fields.");
                    return;
                }
                if (newPassword !== confirmPassword) {
                    setAlert(alert, "New passwords do not match.");
                    return;
                }
                if (newPassword.length < 8) {
                    setAlert(alert, "Password must be at least 8 characters.");
                    return;
                }
            }

            // Firebase requires a fresh sign-in before changing email or password.
            if ((wantsPasswordChange || emailChanged) && !currentPassword) {
                setAlert(alert, "Please enter your current password to change your email or password.");
                return;
            }

            btn.disabled = true;
            try {
                if (wantsPasswordChange || emailChanged) {
                    await reauth(user, currentPassword);
                }
                if (emailChanged)        await updateEmail(user, email);
                if (wantsPasswordChange) await updatePassword(user, newPassword);

                await saveProfile(user.uid, { firstName, lastName, email, dob });

                $("current_password").value = "";
                $("new_password").value = "";
                $("confirm_password").value = "";

                setAlert(
                    alert,
                    wantsPasswordChange
                        ? "Account and password updated successfully!"
                        : "Account updated successfully!",
                    "success"
                );
            } catch (err) {
                setAlert(alert, friendlyError(err));
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
